<nav class="usli-breadcrumb" aria-label="breadcrumb">
  <ol class="breadcrumb">
    @for (item of items(); track item.label; let last = $last) {
      <li class="breadcrumb-item" [class.active]="last" [attr.aria-current]="last ? 'page' : null">
        @if (!last && item.href) {
          <a [href]="item.href" (click)="itemClick.emit(item)">{{ item.label }}</a>
        } @else {
          {{ item.label }}
        }
      </li>
    }
  </ol>
</nav>
